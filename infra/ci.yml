name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  check:
    name: typecheck + sim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      RW_ENV: ci
      JWT_SECRET: ci-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck -w @relicwake/sim
      - run: npm run typecheck -w @relicwake/shared
      - name: API health (boot)
        run: |
          npx tsx services/api/src/main.ts &
          pid=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3000/api/health; then
              kill $pid || true
              exit 0
            fi
            sleep 0.3
          done
          kill $pid || true
          echo "api did not boot"
          exit 1
